<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KDS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="KDS">
    <meta name="theme-color" content="#000000">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-TileImage" content="/assets/icons/icon-144.png">

    <title>KDS</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.ico" type="image/x-icon" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <meta itemprop="name" content="KD Space">
    <meta itemprop="description" content="A creative 3D space exploration">
    <meta itemprop="image" content="https://my-room-in-3d.vercel.app/social/share-1200x630.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="KD Space">
    <meta name="twitter:description" content="A creative 3D space exploration">
    <meta name="twitter:image" content="https://my-room-in-3d.vercel.app/social/share-1200x630.png">

    <meta property="og:site_name" content="KD Space">
    <meta property="og:type" content="website">
    <meta property="og:title" content="KD Space">
    <meta property="og:description" content="A creative 3D space exploration">
    <meta property="og:image" content="https://my-room-in-3d.vercel.app/social/share-1200x630.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="experience"></div>
    <div class="credits"></div>

    <div class="intro-screen">
        <div class="intro-logo">
            <img src="assets/kdlogodev.png" alt="KDS">
        </div>
        <div class="intro-subtitle">SPACE</div>
        <button class="intro-enter-btn">Enter Room</button>
    </div>

    <button class="studio-mode-btn">Studio</button>

    <div class="presence-widget">
        <button class="presence-toggle">
            <span class="presence-dots"></span>
            <span class="presence-count">1 online</span>
        </button>
        <div class="presence-popover">
            <div class="profile-popover-title">In this space</div>
            <div class="presence-list"></div>
            <div class="presence-note">Same-browser tabs · local-first</div>
        </div>
    </div>

    <div class="profile-chip">
        <button class="profile-chip-btn">
            <span class="profile-chip-dot"></span>
            <span>You: <span class="profile-chip-name">KD</span></span>
        </button>
        <div class="profile-popover">
            <div class="profile-popover-title">Your identity</div>
            <input class="profile-name-input" type="text" maxlength="24" placeholder="Display name" spellcheck="false">
            <div class="profile-color-swatches"></div>
            <div class="profile-space-section">
                <div class="profile-popover-title">KD Space</div>
                <div class="profile-space-line">
                    <span class="profile-space-role">Owner</span>
                    <span class="profile-space-id"></span>
                </div>
                <input class="profile-space-name-input" type="text" maxlength="32" placeholder="Space name" spellcheck="false">
                <button class="profile-copy-space-btn">Copy Space Link</button>
                <div class="profile-space-status"></div>
            </div>
        </div>
    </div>

    <div class="studio-panel">
        <div class="studio-panel-header">
            <span>Studio Mode</span>
            <button class="studio-panel-close">&times;</button>
        </div>
        <div class="studio-panel-body">
            <div class="studio-section">
                <label class="studio-label">Import</label>
                <input type="file" class="studio-file-input" accept=".glb,.gltf">
                <button class="studio-upload-btn">Upload GLB/GLTF</button>
            </div>
            <div class="studio-section">
                <label class="studio-label">Primitives</label>
                <div class="studio-primitive-btns">
                    <button class="studio-add-cube">Cube</button>
                    <button class="studio-add-sphere">Sphere</button>
                    <button class="studio-add-cylinder">Cylinder</button>
                    <button class="studio-add-plane">Plane</button>
                </div>
            </div>
            <div class="studio-section">
                <label class="studio-label">Props</label>
                <div class="studio-primitive-btns">
                    <button class="studio-add-plant">Desk Plant</button>
                    <button class="studio-add-lamp">Desk Lamp</button>
                </div>
            </div>
            <div class="studio-section">
                <label class="studio-label">Screens</label>
                <div class="studio-screen-config" data-screen="monitor">
                    <div class="studio-screen-head">
                        <span>Monitor</span>
                        <select class="studio-screen-mode">
                            <option value="video">Local video</option>
                            <option value="youtube">YouTube</option>
                            <option value="site">Live site</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                    <input class="studio-screen-youtube" type="url" placeholder="YouTube watch URL" spellcheck="false">
                    <input class="studio-screen-site" type="url" placeholder="https://example.com" spellcheck="false">
                </div>
                <div class="studio-screen-config" data-screen="laptop">
                    <div class="studio-screen-head">
                        <span>Laptop</span>
                        <select class="studio-screen-mode">
                            <option value="video">Local video</option>
                            <option value="youtube">YouTube</option>
                            <option value="site">Live site</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                    <input class="studio-screen-youtube" type="url" placeholder="YouTube watch URL" spellcheck="false">
                    <input class="studio-screen-site" type="url" placeholder="https://example.com" spellcheck="false">
                </div>
                <button class="studio-kracked-link">Open KrackedDevs ↗</button>
            </div>
            <div class="studio-section">
                <label class="studio-label">Transform</label>
                <div class="studio-transform-btns">
                    <button class="studio-transform-btn active" data-mode="translate">Move</button>
                    <button class="studio-transform-btn" data-mode="rotate">Rotate</button>
                    <button class="studio-transform-btn" data-mode="scale">Scale</button>
                </div>
            </div>
            <div class="studio-section">
                <label class="studio-label">Objects</label>
                <div class="studio-object-list"></div>
                <button class="studio-remove-btn">Remove Selected</button>
            </div>
            <div class="studio-section">
                <label class="studio-label">Layout</label>
                <div class="studio-primitive-btns">
                    <button class="studio-save-btn">Save Layout</button>
                    <button class="studio-load-btn">Load Layout</button>
                    <button class="studio-share-btn">Copy Share Link</button>
                    <button class="studio-reset-btn">Reset Layout</button>
                </div>
                <div class="studio-status"></div>
            </div>
        </div>
    </div>

    <div class="interactive-tooltip"></div>

    <div class="media-panel">
        <div class="media-panel-header">
            <span class="media-panel-title">Live site</span>
            <button class="media-panel-open" title="Open in a new tab">Open ↗</button>
            <button class="media-panel-close" title="Close">&times;</button>
        </div>
        <div class="media-panel-bar">
            <input class="media-panel-address" type="url" placeholder="https://" spellcheck="false">
            <button class="media-panel-go">Go</button>
        </div>
        <iframe class="media-panel-frame" src="about:blank" title="KD Space live panel" allow="autoplay; fullscreen; encrypted-media" referrerpolicy="no-referrer"></iframe>
        <div class="media-panel-resize" title="Drag to resize"></div>
    </div>
</body>
</html>
